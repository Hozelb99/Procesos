  <style>
    :root{--navy:#0f2a43;--navy2:#173a5a;--amber:#f2a900;--red:#c8372d}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}
    body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--navy);color:#16222e;font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
    #acceso{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:max(20px,env(safe-area-inset-top)) 20px 20px}
    #acceso[hidden]{display:none}
    .caja{background:#fff;border-radius:16px;padding:28px 24px;width:100%;max-width:400px;box-shadow:0 20px 50px rgba(0,0,0,.35)}
    .marca{display:flex;gap:12px;align-items:center;margin-bottom:18px}.marca img{width:48px;height:48px}
    .marca strong{display:block;font-size:19px;color:var(--navy)}.marca small{color:#5b6b7b}
    h1{font-size:20px;margin:0 0 6px;color:var(--navy)}p{margin:0 0 16px;color:#5b6b7b;font-size:14px}
    label{display:block;font-weight:600;font-size:14px;margin-bottom:6px}
    .campo{display:flex;gap:8px}input[type=password],input[type=text]{flex:1;min-width:0;font-size:16px;padding:12px;border:1px solid #c5d0db;border-radius:10px;min-height:46px}
    input:focus{outline:3px solid #f2a90066;border-color:var(--navy)}
    button{font:inherit;min-height:46px;border-radius:10px;border:0;padding:0 16px;cursor:pointer}
    #ver{background:#eef2f6;color:var(--navy)}#entrar{width:100%;background:var(--navy);color:#fff;font-weight:700;margin-top:14px}#entrar:disabled{opacity:.6;cursor:not-allowed}
    .rec{display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;font-weight:400}.rec input{width:20px;height:20px}
    #err{margin-top:12px;background:#fbdcd9;color:#8c1f17;border-radius:8px;padding:10px 12px;font-size:14px}
    .nota{margin-top:16px;font-size:12px;color:#5b6b7b}
  </style>
</head>
<body>

  <script type="module">// Pantalla de acceso. El código de la aplicación viaja CIFRADO (AES-256-GCM) en app.enc; la clave se deriva de la contraseña
// con PBKDF2-SHA256. La contraseña no está escrita en ningún archivo: si descifra, es la correcta (GCM autentica el contenido).
const $ = (s) => document.querySelector(s);
const SESION = 'pp_k', LARGA = 'pp_kl', DIAS = 7;
const b64a = (s) => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const aB64 = (u8) => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s); };
const safe = (fn) => { try { return fn(); } catch { return null; } };

let enc = null;
async function cargarEnc() {
  if (enc) return enc;
  const inline = document.getElementById('enc'); // versión de un solo archivo: el cifrado viaja dentro de index.html
  if (inline) { enc = JSON.parse(inline.textContent); return enc; }
  const r = await fetch('app.enc', { cache: 'no-cache' });
  if (!r.ok) throw new Error('red');
  enc = JSON.parse(await r.text()); return enc;
}
async function claveDe(pass, e) {
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({ name: 'PBKDF2', salt: b64a(e.salt), iterations: e.iter, hash: 'SHA-256' }, km, { name: 'AES-GCM', length: 256 }, true, ['decrypt']);
}
async function descifrar(clave, e) {
  const buf = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64a(e.iv) }, clave, b64a(e.data)); // lanza error si la clave no corresponde
  return JSON.parse(new TextDecoder().decode(buf));
}
async function abrir(carga) {
  $('#acceso')?.remove();
  const st = document.createElement('style'); st.id = 'appcss'; st.textContent = carga.css; document.head.appendChild(st);
  document.body.insertAdjacentHTML('afterbegin', carga.shell);
  window.__pp_gate = { bloquear };
  const url = URL.createObjectURL(new Blob([carga.js], { type: 'text/javascript' }));
  await import(url);
}
export function bloquear() {
  safe(() => { sessionStorage.removeItem(SESION); localStorage.removeItem(LARGA); });
  location.reload();
}
async function guardarClave(clave, recordar) {
  const raw = aB64(new Uint8Array(await crypto.subtle.exportKey('raw', clave)));
  safe(() => sessionStorage.setItem(SESION, raw));
  if (recordar) safe(() => localStorage.setItem(LARGA, JSON.stringify({ k: raw, exp: Date.now() + DIAS * 864e5 })));
}
